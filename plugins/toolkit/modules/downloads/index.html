<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Downloads · Orca Toolkit</title>
<style>
:root{color-scheme:dark;font:14px 'Segoe UI',sans-serif;color:#eef2fa;background:#11151e;--muted:#9ba9be;--green:#8cdeb9;--line:#303949}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#243e3b66,transparent 55%);min-height:100vh}main{max-width:1000px;margin:auto;padding:44px 28px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}h1{font-size:26px;margin:0;letter-spacing:-.6px}header p{margin:8px 0 0;color:var(--muted);font-size:13px}.connection{color:var(--green);font-size:12px;white-space:nowrap}.panel,.download{border:1px solid var(--line);border-radius:16px;background:#1a212de6;padding:24px}.panel{margin-bottom:32px}.form-grid{display:grid;grid-template-columns:1fr 175px;gap:18px}.wide{grid-column:1/-1}label{display:block;font-size:12px;color:#b5c1d3;margin-bottom:8px}input,select,button{font:inherit}input,select{border:1px solid #3d495b;border-radius:9px;background:#111923;color:#e8eef7;padding:12px;width:100%;outline:none}input:focus,select:focus{border-color:var(--green)}button{cursor:pointer;border:1px solid #445469;border-radius:8px;padding:10px 14px;background:#283548;color:#e7eef9}button:hover{background:#37475d}button:disabled{opacity:.55;cursor:default}.primary{background:#88d6b2;border-color:#88d6b2;color:#10251e;font-weight:600;align-self:end;min-height:44px}.primary:hover{background:#abe9cb}.form-footer{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-top:20px}.hint{font-size:12px;color:var(--muted);line-height:1.7}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h2{font-size:16px;font-weight:600;margin:0}.quiet{background:transparent;font-size:12px}#downloads{display:grid;gap:14px}.download-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.name{font-size:16px;font-weight:600;overflow-wrap:anywhere}.path{color:var(--muted);font-size:12px;overflow-wrap:anywhere;margin-top:7px}.badge{border:1px solid #466858;color:var(--green);background:#21382e;font-size:11px;padding:5px 8px;border-radius:6px;white-space:nowrap}.badge.paused,.badge.cancelled{background:#252d3a;color:#b3bfd2;border-color:#414b5c}.badge.error{color:#f4b2a3;background:#3c2524;border-color:#764b44}.track{height:6px;background:#303c4c;border-radius:5px;overflow:hidden;margin:20px 0 12px}.fill{height:100%;background:var(--green);transition:width .3s}.stats{display:flex;gap:18px;flex-wrap:wrap;color:#b4c2d6;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.actions button{font-size:12px;padding:8px 12px}.error-text{color:#efad9e;font-size:12px;line-height:1.7;margin-top:12px;overflow-wrap:anywhere}#message{font-size:13px;margin-top:14px;line-height:1.6}#message.error{color:#efad9e}.empty{text-align:center;padding:48px;border:1px dashed var(--line);border-radius:15px;color:var(--muted)}.verified{color:var(--green)}footer{font-size:11px;color:#7e8fa8;margin-top:26px;line-height:1.8}@media(max-width:600px){main{padding:26px 16px}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.panel,.download{padding:18px}h1{font-size:23px}.form-footer{align-items:stretch;flex-direction:column}header{align-items:flex-start}.connection{font-size:11px}}
</style></head><body><main>
<header><div><h1>Downloads</h1><p>Download to this computer. Pick up where you left off.</p></div><span id="connection" class="connection">Connecting…</span></header>
<form id="form" class="panel"><div class="form-grid">
<div class="wide"><label for="source">Remote file</label><input id="source" name="source" placeholder="/home/worker/project/output.mp4" required autocomplete="off"></div>
<div><label for="folder">Save to local folder</label><input id="folder" name="folder" required autocomplete="off"></div>
<div><label for="concurrency">Connections</label><select id="concurrency"><option value="4">4 connections</option><option value="8">8 connections</option><option value="12" selected>12 connections</option><option value="16">16 connections</option></select></div>
</div><div class="form-footer"><span class="hint">Resume support · Automatic retries · SHA-256 verification</span><button id="start" class="primary" type="submit">Start download ↓</button></div><div id="message" role="status" aria-live="polite"></div></form>
<div class="section-head"><h2>Downloads <span id="count"></span></h2><button id="pause-all" class="quiet">Pause all</button></div>
<section id="downloads" aria-label="Downloads"><div class="empty">Your downloads will appear here.</div></section>
<footer>Files are saved locally. Closing Orca pauses active downloads; reopen the manager and choose Resume.</footer>
</main><script nonce="__TOKEN__">
const token='__TOKEN__',$=id=>document.getElementById(id);let previous='',jobs=[],loaded=false;
const sizes=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB';
const time=n=>!Number.isFinite(n)?'—':n<60?Math.ceil(n)+'s':n<3600?Math.ceil(n/60)+'m':(n/3600).toFixed(1)+'h';
function message(text,error=false){$('message').textContent=text;$('message').className=error?'error':'';}
async function api(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:{'X-Download-Token':token,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{}),cache:'no-store'});const result=await r.json();if(!r.ok)throw Error(result.error||'Request failed');return result;}
function element(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function actionButton(row,label,id,action){const b=element('button','',label);b.type='button';b.onclick=async()=>{b.disabled=true;try{await api('/api/action',{id,action});previous='';await refresh();}catch(e){message(e.message,true);}finally{b.disabled=false;}};row.append(b);}
function statsFor(j){const stats=element('div','stats');stats.append(element('span','',Math.floor(j.percent)+'% · '+sizes(j.bytes)+' / '+sizes(j.size)));if(j.status==='downloading')stats.append(element('span','',sizes(j.speed)+'/s'),element('span','',j.connections+'/'+j.concurrency+' connections'),element('span','','About '+time((j.size-j.bytes)/j.speed)+' left'));if(j.retries)stats.append(element('span','',j.retries+' retries'));if(j.verified)stats.append(element('span','verified','SHA-256 verified'));return stats;}
function updateProgress(){for(const j of jobs){const card=document.querySelector('[data-job-id="'+j.id+'"]');if(!card)continue;card.querySelector('.fill').style.width=j.percent+'%';card.querySelector('.stats').replaceWith(statsFor(j));}}
function render(){const root=$('downloads');root.replaceChildren();$('count').textContent=jobs.length?'· '+jobs.length:'';
 if(!jobs.length){root.append(element('div','empty','Your downloads will appear here.'));return;}
 for(const j of jobs){const card=element('article','download'),head=element('div','download-head'),info=element('div');card.dataset.jobId=j.id;info.append(element('div','name',j.name),element('div','path',j.source));head.append(info,element('span','badge '+j.status,j.status==='complete'?'Complete ✓':j.status[0].toUpperCase()+j.status.slice(1)));card.append(head);
 const track=element('div','track'),fill=element('div','fill');fill.style.width=j.percent+'%';track.append(fill);card.append(track);
 card.append(statsFor(j),element('div','path',j.destination));
 const actions=element('div','actions');if(['preparing','downloading','verifying'].includes(j.status))actionButton(actions,'Pause',j.id,'pause');if(['paused','error'].includes(j.status))actionButton(actions,'Resume',j.id,'resume');if(!['complete','cancelled'].includes(j.status))actionButton(actions,'Cancel',j.id,'cancel');
 if(j.status==='complete'){const open=element('button','','Open folder');open.onclick=()=>api('/api/open-folder',{id:j.id}).catch(e=>message(e.message,true));actions.append(open);}
 if(j.cleanupWarning)actionButton(actions,'Clear access',j.id,'cleanup');card.append(actions);if(j.error)card.append(element('div','error-text',j.error));if(j.cleanupWarning)card.append(element('div','error-text',j.cleanupWarning));root.append(card);
 }}
async function refresh(){try{const state=await api('/api/jobs');$('connection').textContent='● Connected';if(!loaded){$('folder').value=state.defaultFolder;loaded=true;}const next=JSON.stringify(state.jobs.map(j=>({id:j.id,status:j.status,error:j.error,cleanupWarning:j.cleanupWarning,verified:j.verified})));jobs=state.jobs;if(next!==previous){previous=next;render();}else updateProgress();}catch(e){$('connection').textContent='Disconnected';message(e.message,true);}}
$('form').onsubmit=async e=>{e.preventDefault();$('start').disabled=true;message('');try{await api('/api/jobs',{source:$('source').value.trim(),folder:$('folder').value.trim(),concurrency:Number($('concurrency').value)});message('Download added.');previous='';await refresh();}catch(e){message(e.message,true);}finally{$('start').disabled=false;}};
$('pause-all').onclick=async()=>{try{await api('/api/pause-all',{});previous='';await refresh();}catch(e){message(e.message,true);}};
refresh();setInterval(()=>{if(document.visibilityState==='visible')refresh();},1000);
</script></body></html>
