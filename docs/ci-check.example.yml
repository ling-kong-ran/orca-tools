name: Check tools
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check.py
      - run: python scripts/test_install.py
      - run: python tools/account-switcher/test_panel.py
      - run: python -m unittest discover -p 'test_*.py' -v
        working-directory: services/local-gpu-bridge
      - run: node --test plugins/toolkit/test.cjs plugins/toolkit/test-accounts.cjs plugins/toolkit/test-directory-picker.cjs plugins/toolkit/test-remote-browser.cjs plugins/toolkit/modules/downloads/test.cjs plugins/toolkit/modules/downloads/test-settings.cjs
      - run: python plugins/toolkit/modules/downloads/test_remote.py
