<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Claude Accounts</title>
  <style>
    :root{color-scheme:dark;font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:#11141b;color:#eff2f8;--muted:#96a2b8;--line:#2a3241;--green:#80deb6}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 0,#20334366,transparent 55%),#11141b}
    main{max-width:820px;margin:auto;padding:48px 32px 56px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:36px}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border:1px solid #466b60;border-radius:14px;background:#203c35;color:var(--green);display:grid;place-items:center;font-size:21px;font-weight:600}.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.12em}.title-small{font-size:16px;font-weight:600;margin-top:4px}
    .connection{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;background:#8490a5;border-radius:50%}.connection.online{color:var(--green)}.online .dot{background:var(--green)}
    h1{font-size:24px;line-height:1.3;margin:0;letter-spacing:-.5px}.lead{font-size:14px;line-height:1.8;color:var(--muted);margin:0}.context{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;margin:20px 0 30px;color:#c1cbdc}.tag{padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:#191e29}.host{font-family:Consolas,monospace;color:var(--muted)}
    .section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section-head h2{font-size:14px;margin:0;font-weight:500;color:#d1d9e7}.count{color:var(--muted);font-weight:400}
    button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid #394659;background:#252f41;color:#e9eef8;padding:10px 15px;white-space:nowrap;transition:background .15s,border-color .15s}button:hover{background:#334157;border-color:#607592}button:focus-visible{outline:2px solid var(--green);outline-offset:3px}button:disabled{cursor:default;opacity:.65}.refresh{font-size:12px;background:transparent;border-color:var(--line);padding:8px 12px}.refresh:hover{background:#232b39}
    .cards{display:grid;gap:14px}.card{display:flex;align-items:center;gap:16px;padding:24px;border:1px solid var(--line);border-radius:15px;background:#1a202be6}.card.current{border-color:#4e856e;background:linear-gradient(110deg,#20382f88,#1a202b 80%)}.avatar{display:grid;place-items:center;flex-shrink:0;width:46px;height:46px;border-radius:13px;background:#303b4d;color:#c6d2e9;font-size:18px;font-weight:600}.current .avatar{background:#294e3e;color:var(--green)}.info{flex:1;min-width:0}.email{font-size:15px;font-weight:500;overflow-wrap:anywhere;line-height:1.5}.detail{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:12px;color:var(--muted)}.badge{color:var(--green);font-size:11px;border:1px solid #416852;background:#244538;padding:3px 7px;border-radius:5px}.current-button{background:#243e32;border-color:#426551;color:var(--green)}
    .status{padding:14px 16px;border-radius:10px;font-size:13px;line-height:1.6;background:#1a2332;color:#bfcde2;margin-top:18px;border:1px solid var(--line)}.status.success{border-color:#386d51;background:#1c3026;color:#a0e5bf}.status.error{border-color:#764844;background:#35211f;color:#f1b3a7}.notice{margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}.notice-title{font-size:13px;margin-bottom:8px;color:#d2dbea}.notice p{margin:0;font-size:13px;line-height:1.9;color:var(--muted)}kbd{font:12px "Segoe UI","Microsoft YaHei",sans-serif;border:1px solid #394459;border-radius:5px;padding:2px 6px;color:#d5def0;background:#222b3b}.foot{margin-top:30px;font-size:11px;line-height:1.8;color:#6f7f97}.empty{padding:32px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted);font-size:14px}
    @media(max-width:580px){main{padding:28px 18px}header{margin-bottom:28px}h1{font-size:20px}.card{padding:18px;gap:12px;flex-wrap:wrap}.avatar{width:38px;height:38px;font-size:15px}.card button{margin-left:50px}.connection{font-size:11px}.host{width:100%}}
  .usage{margin-top:16px;display:grid;gap:12px}.usage-line{display:flex;justify-content:space-between;font-size:12px;color:#c1cbdc;gap:12px}.track{height:5px;background:#303b4d;border-radius:5px;margin-top:6px;overflow:hidden}.fill{height:100%;background:var(--green)}.reset,.updated{font-size:11px;color:var(--muted);margin-top:5px}.card{align-items:flex-start}.updated{margin-top:12px}
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand"><div class="logo" aria-hidden="true">⇄</div><h1>Claude Accounts</h1></div>
    <div id="connection" class="connection"><span class="dot"></span><span id="connection-label">Connecting</span></div>
  </header>
  <section aria-label="Claude accounts">
    <div class="section-head"><h2>Accounts <span id="count" class="count"></span></h2><button id="refresh" class="refresh">↻ Refresh</button></div>
    <div id="cards" class="cards"><div class="empty">Loading accounts…</div></div>
  </section>
  <div id="status" class="status" role="status" aria-live="polite">Loading…</div>
</main>
<script nonce="__PANEL_TOKEN__">
  const token='__PANEL_TOKEN__';
  let state=null,busy=false,requestSequence=0;
  const $=id=>document.getElementById(id);
  function status(text,kind=''){const el=$('status');el.textContent=text;el.className='status '+kind;}
  function connection(online){$('connection').className='connection'+(online?' online':'');$('connection-label').textContent=online?'Connected':'Disconnected';}
  async function api(path,options={}){
    const response=await fetch(path,{...options,headers:{'X-Panel-Token':token,'Content-Type':'application/json'},cache:'no-store'});
    let body;try{body=await response.json();}catch{throw new Error('Unable to read the response. Refresh to try again.');}
    if(!response.ok)throw new Error(body.error||'Request failed. Refresh to try again.');
    return body;
  }
  function resetText(timestamp){
    if(!Number.isFinite(timestamp))return 'Reset time unavailable';
    const delta=timestamp-Date.now();
    const date=new Date(timestamp).toLocaleString(undefined,{timeZone:'Asia/Hong_Kong',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
    if(delta<=0)return 'Reset time passed · Refresh usage';
    const minutes=Math.ceil(delta/60000),days=Math.floor(minutes/1440),hours=Math.floor(minutes%1440/60),mins=minutes%60;
    return 'Resets in '+(days?days+'d ':'')+(hours?hours+'h ':'')+mins+'m · '+date+' HKT';
  }
  function usageView(usage){
    const block=document.createElement('div');block.className='usage';
    if(!usage){block.textContent='Usage unavailable';block.className='updated';return block;}
    for(const [key,label] of [['session','5-hour limit'],['weekly','Weekly limit']]){
      const window=usage[key],row=document.createElement('div');
      const line=document.createElement('div');line.className='usage-line';
      const name=document.createElement('span');name.textContent=label;
      const percent=document.createElement('span');const valid=Number.isFinite(window?.usedPercent);
      percent.textContent=valid?window.usedPercent+'% used':'Unavailable';line.append(name,percent);row.append(line);
      if(valid){const track=document.createElement('div');track.className='track';const fill=document.createElement('div');fill.className='fill';fill.style.width=Math.max(0,Math.min(100,window.usedPercent))+'%';if(window.usedPercent>=100)fill.style.background='#eea27e';track.append(fill);row.append(track);}
      if(window){const reset=document.createElement('div');reset.className='reset';reset.dataset.reset=window.resetsAt;reset.textContent=resetText(window.resetsAt);row.append(reset);}
      block.append(row);
    }
    const updated=document.createElement('div');updated.className='updated';
    updated.textContent=usage.updatedAt?'Updated '+new Date(usage.updatedAt).toLocaleString('en-GB',{timeZone:'Asia/Hong_Kong'})+' HKT':'Update time unavailable';
    if(usage.status!=='ok')updated.textContent+=' · Cached data';
    block.append(updated);return block;
  }
  function render(){
    $('count').textContent='· '+state.accounts.length;
    const cards=$('cards');cards.replaceChildren();
    if(!state.accounts.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='No accounts added yet.';cards.append(empty);}
    for(const account of state.accounts){
      const row=document.createElement('div');row.className='card'+(account.current?' current':'');
      const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=(account.email||'?')[0].toUpperCase();avatar.setAttribute('aria-hidden','true');
      const info=document.createElement('div');info.className='info';
      const email=document.createElement('div');email.className='email';email.textContent=account.email;
      const detail=document.createElement('div');detail.className='detail';
      if(account.current){const badge=document.createElement('span');badge.className='badge';badge.textContent='Active';detail.append(badge);}
      info.append(email);if(account.current)info.append(detail);info.append(usageView(account.usage));
      const button=document.createElement('button');button.textContent=account.current?'Active':account.needsSignIn?'Sign in required':'Switch';button.disabled=account.current||account.needsSignIn||busy;
      button.className=account.current?'current-button':'';button.setAttribute('aria-label',account.current?account.email+' is active':'Switch to '+account.email);
      button.onclick=()=>select(account);
      row.append(avatar,info,button);cards.append(row);
    }
    $('refresh').disabled=busy;
  }
  async function refresh(quiet=false){
    if(busy)return;
    const sequence=++requestSequence;
    try{const next=await api(quiet?'/api/accounts':'/api/accounts?refresh=1');if(busy||sequence!==requestSequence)return;
      const changed=JSON.stringify(next)!==JSON.stringify(state);state=next;connection(true);if(changed)render();
      if(!quiet||changed){const current=state.accounts.find(a=>a.current);status(current?'Active: '+current.email:'Select an account.');}
    }catch(error){if(!busy&&sequence===requestSequence){connection(false);status(error.message,'error');}}
  }
  async function select(account){
    if(busy||account.current||account.needsSignIn)return;
    busy=true;++requestSequence;render();status('Switching to '+account.email+'…');
    try{state=await api('/api/select',{method:'POST',body:JSON.stringify({accountId:account.id,expectedActiveAccountId:state.activeAccountId})});connection(true);status('Switched to '+account.email+'. Start a new Claude session to use it.','success');}
    catch(error){status(error.message,'error');try{state=await api('/api/accounts');}catch{} }
    finally{busy=false;if(state)render();}
  }
  $('refresh').onclick=()=>refresh();
  refresh(true);
  setInterval(()=>document.querySelectorAll('[data-reset]').forEach(el=>el.textContent=resetText(Number(el.dataset.reset))),30000);
  setInterval(()=>{if(document.visibilityState==='visible')refresh(true);},20000);
</script>
</body>
</html>
